grails:
  profile: web
  codegen:
    defaultPackage: rhumanos
  gorm:
    reactor:
      # Whether to publish events on data access operations
      events: false
  controllers:
    defaultScope: singleton
  converters:
    encode-quoted: false
  urlmapping:
    cache.maxsize: 1000
  # Configuración del plugin grails-mail (envía los correos de incidencias)
  mail:
    enabled: false
    host: localhost
    port: 25
    username: ''
    password: ''
    props:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

spring:
  main:
    banner-mode: "off"
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  web:
    cors:
      allowed-origins: "http://localhost:5173"
      allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
      allowed-headers: "*"
      allow-credentials: true
      max-age: 3600

server:
  port: 8080
  servlet:
    session:
      cookie:
        secure: false

# Directorio donde se guardan los archivos .CHK subidos (archivoRegistros).
# Si no se define, se usa "payload" relativo al directorio de trabajo.
rh:
  payloadDir: payload
