grails:
  profile: web
  codegen:
    defaultPackage: rhumanos
  gorm:
    reactor:
      # Whether to publish events on data access operations
      events: false
  controllers:
    defaultScope: singleton
  converters:
    encode-quoted: false
  urlmapping:
    cache.maxsize: 1000
  # Configuración del plugin grails-mail (envía los correos de incidencias)
  mail:
    enabled: false
    host: localhost
    port: 25
    username: ''
    password: ''
    props:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
  plugin:
    springsecurity:
      security:
        configType: Annotation
      cors: true
      password:
        algorithm: 'SHA-256'
        hash:
          iterations: 1
      userLookup:
        userDomainClassName: 'rhumanos.User'
        authorityJoinClassName: 'rhumanos.UserRole'
        authorityClassName: 'rhumanos.Role'
      interceptUrlMap:
        - pattern: '/rhumanos/**'
          access: ['ROLE_RH_USUARIO', 'ROLE_RH_ADMIN']
        - pattern: '/catalogosRh/**'
          access: ['ROLE_RH_USUARIO', 'ROLE_RH_ADMIN']
        - pattern: '/login/**'
          access: ['permitAll']
        - pattern: '/logout/**'
          access: ['permitAll']
        - pattern: '/**'
          access: ['permitAll']
      filterChain:
        chainMap:
          - pattern: '/**'
            filters: 'JOINED_FILTERS,-exceptionTranslationFilter,-authenticationProcessingFilter,-securityContextPersistenceFilter'

dataSource:
  pooled: true
  driverClassName: com.mysql.cj.jdbc.Driver
  username: root
  password: C14R1741

environments:
  development:
    dataSource:
      dbCreate: update
      url: jdbc:mysql://172.16.1.202:3306/PruebaEver?useSSL=false&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&allowPublicKeyRetrieval=true
      properties:
        maximumPoolSize: 80
        minimumIdle: 10
        connectionTestQuery: SELECT 1
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true

spring:
  main:
    banner-mode: "off"
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  web:
    cors:
      allowed-origins: "http://localhost:5173"
      allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
      allowed-headers: "*"
      allow-credentials: true
      max-age: 3600

server:
  port: 8081
  servlet:
    session:
      cookie:
        secure: false

# Directorio donde se guardan los archivos .CHK subidos (archivoRegistros).
# Si no se define, se usa "payload" relativo al directorio de trabajo.
rh:
  payloadDir: payload
