version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rh-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - DB_HOST=172.16.1.202
      - DB_PORT=3306
      - DB_NAME=secah2014
      - DB_USER=root
      - DB_PASSWORD=C14R1741
    volumes:
      - backend-payload:/app/payload
    networks:
      - rh-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rh-frontend
    ports:
      - "443:443"
    depends_on:
      - backend
    networks:
      - rh-network
    restart: unless-stopped

networks:
  rh-network:
    driver: bridge

volumes:
  backend-payload:
